# Gitleaks Configuration for DK Academy
title = "DK Academy Gitleaks Security Policy"

[extend]
useDefault = true

[allowlist]
description = "Allowed placeholder test references"
paths = [
  '''\.env\.example$''',
  '''package-lock\.json$''',
  '''node_modules''',
  '''dist/''',
  '''backend/public/''',
  '''frontend/dist/''',
  '''SECURITY_ROTATION\.md'''
]
regexes = [
  '''rzp_test_placeholder''',
  '''placeholder_secret'''
]

[[rules]]
id = "mongodb-connection-string"
description = "MongoDB Connection String with Embedded Credentials"
regex = '''mongodb(\+srv)?:\/\/[a-zA-Z0-9_.-]+:[a-zA-Z0-9_.-]+@'''
tags = ["database", "mongodb", "credential"]

[[rules]]
id = "razorpay-key-secret"
description = "Razorpay Key Secret Detection"
regex = '''(?i)(razorpay|rzp).{0,20}['\"][a-zA-Z0-9]{20,}['\"]'''
tags = ["payment", "razorpay", "secret"]

[[rules]]
id = "jwt-secret-string"
description = "Hardcoded JWT Secret String"
regex = '''(?i)(jwt_secret|jwtSecret).{0,20}['\"][a-zA-Z0-9]{20,}['\"]'''
tags = ["auth", "jwt", "secret"]

